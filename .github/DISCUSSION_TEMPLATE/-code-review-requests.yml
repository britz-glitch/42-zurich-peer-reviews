
title: "[Review Needed] "
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome, Pisciner! 👋
        Request a code review from the 42 Zürich community.
        Please share your own work and avoid posting
        complete solutions to restricted assignments.

  - type: input
    id: exercise
    attributes:
      label: Exercise name
      description: Which exercise are you working on?
      placeholder: "e.g. ft_atoi, ft_split, ft_strdup"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What do you need help with?
      description: Explain your problem or question.
      placeholder: "I'm struggling with..."
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Your C code
      description: Paste the relevant part of your code.
      render: c
    validations:
      required: false

  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      placeholder: "I already tried..."
    validations:
      required: false

  - type: dropdown
    id: feedback
    attributes:
      label: What kind of feedback would help?
      options:
        - General code review
        - Finding a bug
        - Understanding the logic
        - Norminette or code style
        - Memory management
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 🔍 How reviews work
        A reviewer can comment "I'll review this!"
        and give you feedback.

        When your review is finished, edit your
        discussion title to start with [DONE].

        Be kind. Help each other learn. 💙
